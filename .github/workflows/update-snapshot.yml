name: Daily snapshot and Pages deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/update-snapshot.yml"
      - "scripts/update-snapshot.mjs"
      - "data/snapshot.json"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "package.json"
  schedule:
    # Runs daily at 12:10 Asia/Shanghai, after the upstream Arena mirror refresh.
    - cron: "10 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh daily snapshot
        run: node scripts/update-snapshot.mjs

      - name: Validate generated snapshot
        run: |
          node --check app.js
          node --check scripts/update-snapshot.mjs
          node -e "const s=require('./data/snapshot.json'); for (const k of ['chat','image','video']) { const n=s.sections[k].models.filter(m=>m.active).length; if (!n) throw new Error(k+' has no active models'); console.log(k, n); }"

      - name: Commit snapshot changes
        run: |
          if [[ -n "$(git status --porcelain data/snapshot.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/snapshot.json
            git commit -m "Update daily model snapshot"
            git push
          else
            echo "No snapshot changes"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


